
name: CI

on:
  pull_request:
    branches:
      - DEV
      - HOM
      - main

  push:
    branches:
      - DEV
      - HOM
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Confirmar execução
        run: echo "GitHub Actions funcionando"

  ruff:
    name: Ruff
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Ruff
        run: python -m pip install ruff

      - name: Analisar código Python
        run: ruff check --output-format=github .

  branch-flow:
    if: github.event_name == 'pull_request'
    name: Validate branch flow
    runs-on: ubuntu-latest

    steps:
      - name: Validate promotion path
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "${BASE_REF}:${HEAD_REF}" in
            DEV:feature/*) exit 0 ;;
            DEV:fix/*) exit 0 ;;
            DEV:hotfix/*) exit 0 ;;
            DEV:refactor/*) exit 0 ;;
            DEV:test/*) exit 0 ;;
            DEV:ci/*) exit 0 ;;
            DEV:docs/*) exit 0 ;;
            DEV:chore/*) exit 0 ;;
            HOM:DEV) exit 0 ;;
            main:HOM) exit 0 ;;
            *)
              echo "Invalid promotion path: ${HEAD_REF} -> ${BASE_REF}"
              exit 1
              ;;
          esac